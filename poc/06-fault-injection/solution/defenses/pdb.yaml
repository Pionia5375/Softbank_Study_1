# 시나리오 1(spot 모드) 방어: PodDisruptionBudget — 정답본
# PDB = "자발적으로 파드를 빼낼 때(drain, 클러스터 업그레이드) 최소 몇 개는 살아 있어야 한다" 는 약속.
# 노드가 갑자기 죽는 건(hard) 자발적이 아니라서 PDB 와 상관없다. 스팟 회수 예고를 받고 drain 할 때만 효과가 있다.
#   https://kubernetes.io/docs/concepts/workloads/pods/disruptions/
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: hello
  namespace: tenant-a
spec:
  # replicas 2 중 1개는 항상 남긴다. 2(=replicas)로 두면 drain 이 영원히 못 끝난다 (README 4.4 깨뜨리기)
  minAvailable: 1
  selector:
    matchLabels: { app: hello }
