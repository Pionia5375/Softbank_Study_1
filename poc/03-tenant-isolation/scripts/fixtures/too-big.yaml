# 컨테이너 하나가 CPU 2코어를 달라는 파드 (Claude 작성, 테스트 도구).
# --dry-run=server 로만 보낸다: 실제로 만들지 않고 API 서버의 검사(LimitRange max)만 받아 본다.
apiVersion: v1
kind: Pod
metadata:
  name: iso-too-big
  labels:
    poc03: fixture
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: big
      image: busybox:1.36
      command: ["sleep", "60"]
      resources:
        requests: { cpu: "2", memory: 64Mi }
        limits: { cpu: "2", memory: 64Mi }
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
