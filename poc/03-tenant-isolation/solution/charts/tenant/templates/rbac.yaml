# 권한 울타리. "이 테넌트 사람·봇은 자기 namespace 에서만, 정해진 일만" 할 수 있게.
# Role 은 namespace 안에서만 효력이 있다 → tenant-a 의 Role 은 tenant-b 에 아무 힘이 없다.

# 1) 봇 계정: CI·배포 에이전트(05 단계 MCP 도구)가 이 계정으로 kubectl 을 친다
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deployer
  namespace: {{ .Values.name }}
---
# 2) 할 수 있는 일 목록
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tenant-developer
  namespace: {{ .Values.name }}
rules:
  # 함수 배포·조회·로그
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log", "events", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # 울타리는 볼 수만 있고 못 바꾼다 (바꾸면 격리가 무의미)
  - apiGroups: [""]
    resources: ["resourcequotas", "limitranges"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch"]
  # secrets 는 일부러 뺐다. 필요해지면 resourceNames 로 콕 집어서 준다
---
# 3) 누구에게 줄지: 사람 그룹 + 봇 계정
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tenant-developer
  namespace: {{ .Values.name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tenant-developer
subjects:
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: {{ .Values.rbac.group | default (printf "%s-developers" .Values.name) }}
  - kind: ServiceAccount
    name: deployer
    namespace: {{ .Values.name }}
