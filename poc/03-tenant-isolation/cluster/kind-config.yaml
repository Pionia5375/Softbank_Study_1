# poc/03-tenant-isolation 용 kind 클러스터 (Claude 작성, 완성본)
# 01 단계 설정(poc/01-argocd/cluster/kind-config.yaml)과 달라진 점은 딱 두 가지다.
#   1) disableDefaultCNI: true  → kind 기본 CNI(kindnet)를 빼고 그 자리에 Cilium 을 깐다.
#      kindnet 은 NetworkPolicy 를 강제하지 않아서, "A 테넌트가 B 를 못 부른다" 실험이 안 된다.
#   2) 워커 1개 → 3개. 04 단계(노드 풀)가 이 파일을 그대로 기준으로 쓴다.
#      오늘은 라벨(이름표)만 붙이고, 출입 금지 표시(taint)는 04 단계에서 건다.
# CNI 는 클러스터를 만들 때만 정할 수 있다 → 클러스터를 지우고 다시 만든다 (README 2절).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
# 01 단계와 같은 이름 → kubectl 컨텍스트도 똑같이 kind-faas
name: faas
networking:
  # kindnet 을 깔지 않는다. Cilium 을 깔기 전까지 노드는 NotReady 로 보이는 게 정상이다
  disableDefaultCNI: true
nodes:
  # 컨트롤 플레인: API 서버·스케줄러·etcd
  - role: control-plane
    image: kindest/node:v1.37.0
  # system 풀: Argo CD, 모니터링 같은 플랫폼 파드용
  - role: worker
    image: kindest/node:v1.37.0
    labels:
      pool: system
  # build 풀: 04 단계에서 함수 이미지 빌드 Job 이 여기서 돈다
  - role: worker
    image: kindest/node:v1.37.0
    labels:
      pool: build
  # exec 풀: 테넌트 함수가 실제로 도는 곳
  - role: worker
    image: kindest/node:v1.37.0
    labels:
      pool: exec
