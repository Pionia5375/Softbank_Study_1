# namespace 전체 합계 한도. Jeong 작성.
# 파드를 만들 때 API 서버가 "지금까지 합계 + 새 파드" 를 계산해서 한도를 넘으면 거절한다 (스케줄러가 아니라 API 서버 단계).
# 문서: https://kubernetes.io/docs/concepts/policy/resource-quotas/#compute-resource-quota
apiVersion: v1
kind: ResourceQuota
metadata:
  name: tenant-quota
  # 이 오브젝트가 들어갈 namespace = 테넌트 이름
  namespace: ___
spec:
  hard:
    # 키 이름은 문서의 표 그대로: requests.cpu, requests.memory, limits.cpu, limits.memory, pods, services
    # quote = 값을 따옴표로 감싼다. "1" 과 1 은 YAML 에서 다른 타입이라 안전하게 문자열로
    requests.cpu: {{ .Values.quota.requestsCpu | quote }}
    requests.memory: {{ .Values.quota.requestsMemory | quote }}
    ___: {{ .Values.quota.limitsCpu | quote }}
    limits.memory: {{ .Values.quota.limitsMemory | quote }}
    pods: {{ .Values.quota.pods | quote }}
    services: {{ .Values.quota.services | quote }}
    # 테넌트가 바깥으로 직접 구멍(LoadBalancer·NodePort)을 못 뚫게 0개로 고정
    services.loadbalancers: "0"
    services.nodeports: ___
