# 컨테이너 1개 단위 기본값·최대값. Jeong 작성.
# 왜 Quota 와 짝인가: Quota 가 limits.cpu 를 세기 시작하면, limits 를 안 적은 파드는 "셀 수 없어서" 거절된다.
#   LimitRange 가 기본 limits 를 자동으로 붙여 주면 그런 파드(예: 01 단계 hello-fn)도 들어올 수 있다.
# 문서: https://kubernetes.io/docs/concepts/policy/limit-range/
apiVersion: v1
kind: LimitRange
metadata:
  name: tenant-limits
  namespace: {{ .Values.name }}
spec:
  limits:
    # 단위: Container(컨테이너 하나씩) / Pod(파드 안 컨테이너 합) 중 하나
    - type: ___
      # 빈칸 4곳: values.yaml 의 limitRange 아래 값을 같은 모양으로 읽는다 (위 resourcequota.yaml 참고)
      default:
        cpu: ___
        memory: {{ .Values.limitRange.default.memory | quote }}
      defaultRequest:
        cpu: ___
        memory: {{ .Values.limitRange.defaultRequest.memory | quote }}
      max:
        cpu: ___
        memory: ___
