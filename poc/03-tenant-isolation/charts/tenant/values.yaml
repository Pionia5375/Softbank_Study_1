# tenant 차트 기본값. Jeong 작성.
# 템플릿은 .Values.quota.limitsCpu 처럼 이 파일의 값을 읽는다.
# 테넌트마다 다른 값은 tenants/<이름>.yaml 에 쓰고, 여기 값은 "따로 안 적으면 이거" 다.

# 테넌트 이름 = namespace 이름 = AppProject 이름. 기본값은 일부러 비워 둔다 (템플릿이 required 로 검사)
name: ""

# ---- ResourceQuota: namespace 전체 합계 한도 ----
# 문서: https://kubernetes.io/docs/concepts/policy/resource-quotas/
quota:
  requestsCpu: "1"          # requests.cpu 합계 최대
  requestsMemory: 1Gi
  # TODO(human) 결정 1: 테넌트 하나가 쓸 수 있는 CPU limits 합계. "CPU 를 다 못 먹는다" 의 실제 숫자다.
  #   고려: kind 워커(exec 풀)는 맥 CPU 를 나눠 쓴다. 맥 코어 수의 절반을 넘기면 두 테넌트만으로 맥이 꽉 찬다.
  #   README 6절 결정 표에 고른 값과 이유를 한 줄.
  limitsCpu: ___
  limitsMemory: 2Gi
  pods: "10"
  services: "5"

# ---- LimitRange: 컨테이너 1개 기준 기본값·최대값 ----
# 문서: https://kubernetes.io/docs/concepts/policy/limit-range/
limitRange:
  # resources 를 안 적은 컨테이너에 자동으로 붙는 limits
  default:
    # TODO(human) 결정 2: 기본 CPU limits. 01 단계 hello-fn 은 CPU limits 를 안 적었으니 이 값을 받는다.
    #   너무 크면: 파드 몇 개만으로 Quota(limitsCpu)가 꽉 찬다. 너무 작으면: 함수가 느려진다(스로틀링).
    #   힌트: tenant-b 는 limitsCpu 가 1 이고, hello-fn 2개 + 실험용 파드 2개(각 100m)가 들어가야 한다.
    cpu: ___
    memory: 128Mi
  # resources 를 안 적은 컨테이너에 자동으로 붙는 requests
  defaultRequest:
    cpu: 50m
    memory: 64Mi
  # 컨테이너 1개가 요청할 수 있는 최대값
  max:
    cpu: "1"
    memory: 512Mi

# ---- Pod Security Admission 레벨 ----
# 문서: https://kubernetes.io/docs/concepts/security/pod-security-standards/
# 세 단계: privileged(제한 없음) < baseline(탈출 통로만 막음) < restricted(root 금지 등 깐깐)
podSecurity:
  # TODO(human) 결정 3: 어기면 "거절" 할 레벨. restricted 로 하면 01 단계 hello-fn 이 거절된다 (README 6절 결정 3 에서 dry-run 으로 확인)
  enforce: ___
  warn: restricted          # 어기면 경고만

# ---- 네트워크 ----
network:
  # 이 테넌트로 들어오는 트래픽을 허용할 namespace 이름 목록 (예: 공용 게이트웨이). 기본은 없음 = 빈 목록
  allowFromNamespaces: []

# ---- 권한 ----
rbac:
  # 이 테넌트 개발자로 묶일 그룹 이름. 비우면 템플릿이 "<name>-developers" 로 채운다
  group: ""

# ---- Argo CD ----
argocd:
  namespace: argocd
  repoURL: https://github.com/Pionia5375/Softbank_Study_1
