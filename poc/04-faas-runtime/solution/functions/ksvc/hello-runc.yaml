# Knative Service (ksvc) = 함수 하나. Jeong 작성 (정답본)
# 이 한 장을 넣으면 Knative 가 Deployment·Service·Route·Revision·오토스케일러 설정을 알아서 만든다.
# 문서: https://knative.dev/docs/serving/services/creating-services/
#       https://knative.dev/docs/serving/autoscaling/scale-to-zero/
#       https://knative.dev/docs/serving/autoscaling/scale-bounds/
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: hello-runc
  namespace: fn-runtime
spec:
  template:
    metadata:
      annotations:
        # 요청이 없으면 0개까지 줄인다 (= 콜드 스타트가 생긴다). "0" 이 기본값이지만 결정이 보이게 적어 둔다
        autoscaling.knative.dev/min-scale: "0"
        # 아무리 몰려도 5개까지. 한 함수가 exec 풀을 다 먹는 걸 막는다 (노이지 네이버)
        autoscaling.knative.dev/max-scale: "5"
        # Pod 하나가 동시에 맡을 요청 수 목표. 넘으면 Pod 를 늘린다
        autoscaling.knative.dev/target: "10"
        # 측정 편의: 요청이 끊기고 이 시간이 지나면 0 으로 가는 판단을 시작한다 (기본 60s, 최소 6s)
        autoscaling.knative.dev/window: "6s"
    spec:
      # ---- 어디서 돌까: exec 풀에만 (config-features 플래그가 켜져 있어야 통과) ----
      nodeSelector:
        pool: exec
      tolerations:
        - key: pool
          operator: Equal
          value: exec
          effect: NoSchedule
      containers:
        - image: kind-registry:5000/fn/hello:v1
          ports:
            - containerPort: 8080
          env:
            - name: FN_NAME
              value: hello-runc
          # 3단계 테넌트 namespace 의 Pod Security(restricted) 기준을 미리 맞춘다. 안 쓰면 apply 때 경고가 4줄 나온다
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
