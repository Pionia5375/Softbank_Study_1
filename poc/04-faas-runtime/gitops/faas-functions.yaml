# 4단계 함수들(ksvc 3개)을 Argo CD 가 Git 에서 깔게 하는 Application. Jeong 작성 (빈칸 4개, 막히면 solution/gitops/faas-functions.yaml)
# 1단계 hello-fn Application 과 같은 모양. 다른 점: 차트가 아니라 YAML 폴더, namespace 가 fn-runtime.
# kubectl apply -f poc/04-faas-runtime/gitops/faas-functions.yaml 로 붙인다 (1단계 root 의 apps/ 폴더는 건드리지 않는다)
# 문서: https://argo-cd.readthedocs.io/en/stable/user-guide/directory/
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: faas-functions
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Pionia5375/Softbank_Study_1
    targetRevision: main
    # Chart.yaml 이 없는 폴더 → YAML 파일 묶음으로 읽는다
    path: ___           # TODO(human): ksvc YAML 3개가 든 폴더 (레포 루트 기준)
  destination:
    server: https://kubernetes.default.svc
    namespace: ___      # TODO(human): ksvc 의 metadata.namespace 와 같게
  syncPolicy:
    automated:
      prune: ___        # TODO(human) 결정: 측정 중에 kubectl 로 ksvc 를 고치면 어떻게 되나 생각하고 고른다
      selfHeal: ___
    syncOptions:
      - CreateNamespace=true
