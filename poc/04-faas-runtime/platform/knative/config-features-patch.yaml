# Knative 기능 플래그 켜기. Jeong 작성 (정답본)
# 문서: https://knative.dev/docs/serving/configuration/feature-flags/
#
# Knative Service 는 Pod 스펙의 일부 칸만 허용한다. 나머지는 "기능 플래그"를 켜야 쓸 수 있다.
# 안 켜고 ksvc 에 nodeSelector 를 쓰면, apply 할 때 Knative webhook 이 "must not set the field(s)" 로 거절한다.
# 쓰는 법: kubectl -n knative-serving patch configmap config-features --type merge --patch-file platform/knative/config-features-patch.yaml
data:
  # ksvc 에서 nodeSelector 쓰기 → 함수를 exec 풀에 고정
  kubernetes.podspec-nodeselector: "enabled"
  # ksvc 에서 tolerations 쓰기 → exec 풀의 taint 통과
  kubernetes.podspec-tolerations: "enabled"
  # ksvc 에서 runtimeClassName 쓰기 → gVisor 로 실행
  kubernetes.podspec-runtimeclassname: "enabled"
