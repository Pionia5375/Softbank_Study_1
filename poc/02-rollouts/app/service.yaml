  selector:
    app: ___          # TODO(human): rollout.yaml 의 파드 라벨과 같게
  ports:
    - name: http
      port: ___       # TODO(human): 클러스터 안에서 부를 포트. load.sh 가 http://podinfo.fn-canary.svc.cluster.local/ 로 부른다 (포트 생략 = ?)
      targetPort: ___ # TODO(human): 파드 쪽 포트. 숫자 대신 rollout.yaml 에서 붙인 포트 "이름"을 써 본다
