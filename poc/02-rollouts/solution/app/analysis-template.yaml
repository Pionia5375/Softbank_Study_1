# AnalysisTemplate = "카나리가 괜찮은지 판정하는 법" (정답본)
# 문서: https://argo-rollouts.readthedocs.io/en/stable/features/analysis/
#       https://argo-rollouts.readthedocs.io/en/stable/analysis/prometheus/
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: success-rate
  namespace: fn-canary
spec:
  # Rollout 이 넘겨 주는 값. 아래 query 의 {{args.canary-hash}} 자리에 들어간다
  args:
    - name: canary-hash
  metrics:
    - name: success-rate
      # 카나리 파드가 뜨고 지표가 2~3번 긁힐 때까지 기다린 뒤 첫 측정
      initialDelay: 30s
      # 15초마다 한 번 질의
      interval: 15s
      # 결정 2: 합격선과 몇 번 떨어지면 abort 할지
      # result 는 Prometheus 결과(숫자 목록). 카나리의 2xx 비율이 95% 이상이면 합격
      successCondition: result[0] >= 0.95
      # 불합격이 이 횟수를 "넘으면"(>) Failed. 1 = 두 번째 불합격에서 abort (한 번 튄 값으로는 안 멈춤)
      failureLimit: 1
      # 질의 자체가 실패(Prometheus 주소 틀림, 결과 없음)한 횟수가 이걸 넘으면 Error → 이것도 abort
      consecutiveErrorLimit: 4
      provider:
        prometheus:
          # Prometheus 차트(release 이름 prometheus, namespace monitoring)가 만든 Service 주소
          address: http://prometheus-server.monitoring.svc.cluster.local:80
          # 카나리 파드만, 사용자 요청(path="root")만 골라서 최근 1분 동안의 2xx 비율
          # 창을 30s 가 아니라 1m 로: 나쁜 카나리는 /metrics 긁기도 1/3 확률로 실패해서 점이 빠진다.
          #   30s 창이면 점이 모자라 "결과 없음(Error)" 이 섞여 판정이 늦어진다 (README 6절 실측: 30s 창 95초 vs 1m 창 45초)
          # status=~"2.." = 2로 시작하는 세 자리. 헬스체크(/readyz)는 빼야 숫자가 흐려지지 않는다
          query: |
            sum(rate(http_request_duration_seconds_count{namespace="fn-canary", app="podinfo", path="root", rollouts_pod_template_hash="{{args.canary-hash}}", status=~"2.."}[1m]))
            /
            sum(rate(http_request_duration_seconds_count{namespace="fn-canary", app="podinfo", path="root", rollouts_pod_template_hash="{{args.canary-hash}}"}[1m]))
