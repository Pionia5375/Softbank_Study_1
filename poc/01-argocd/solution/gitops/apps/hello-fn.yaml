# Argo CD Application = "이 Git 경로를, 이 클러스터의 이 namespace 에, 이렇게 맞춰 둬라" 한 장. Jeong 작성.
# 문서: https://argo-cd.readthedocs.io/en/stable/user-guide/application-specification/
#       https://argo-cd.readthedocs.io/en/stable/user-guide/auto_sync/
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello-fn
  # Application 오브젝트 자체는 Argo CD 가 사는 namespace 에 둔다 (함수가 뜨는 곳이 아님)
  namespace: argocd
  # 이 Application 을 지우면 Argo CD 가 만든 Deployment·Service 도 같이 지워 달라는 표시
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  # AppProject = Application 묶음 + 권한 범위. 10/23 테넌트 날에 테넌트별 Project 를 만든다. 오늘은 기본값
  project: default

  # ---- 어디서 가져오나 (Git) ----
  source:
    repoURL: https://github.com/Pionia5375/Softbank_Study_1
    targetRevision: main
    path: poc/01-argocd/functions/hello-fn
    # path 에 Chart.yaml 이 있으면 Argo CD 가 알아서 Helm 차트로 보고 helm template 을 돌린다

  # ---- 어디에 까나 (클러스터) ----
  destination:
    # Argo CD 자신이 사는 클러스터 = 클러스터 안에서 본 API 서버 주소
    server: https://kubernetes.default.svc
    namespace: fn-demo

  # ---- 어떻게 맞추나 ----
  syncPolicy:
    # automated 가 있으면 Git 이 바뀌었을 때 사람이 Sync 버튼을 안 눌러도 적용한다
    automated:
      # TODO(human) 결정 1: Git 에서 지운 리소스를 클러스터에서도 지울까?
      #   true = Git 과 정확히 같게 / false = 지우는 건 사람이 확인 후 (실수로 지운 파일이 운영 리소스를 날리는 걸 막음)
      prune: true
      # TODO(human) 결정 2: 누가 kubectl 로 클러스터를 직접 바꾸면 Git 상태로 되돌릴까?
      #   true = 바로 되돌림 (장애 중 손으로 고친 것도 되돌려짐!) / false = OutOfSync 로 표시만
      selfHeal: true
    syncOptions:
      # destination.namespace 가 없으면 만들어 준다
      - CreateNamespace=true
