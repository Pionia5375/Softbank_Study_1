# Service = 파드들 앞에 붙는 고정 주소 + 로드밸런서. 파드가 바뀌어도 이름(hello-fn)으로 부를 수 있다. Jeong 작성.
# 문서: https://kubernetes.io/docs/concepts/services-networking/service/
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
spec:
  # 요청을 보낼 파드를 라벨로 고른다. Deployment 의 파드 라벨과 같아야 한다
  selector:
    app: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
