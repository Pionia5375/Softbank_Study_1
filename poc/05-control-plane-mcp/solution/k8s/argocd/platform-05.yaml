# 5단계 플랫폼(컨트롤 플레인 + 에이전트 권한)을 Argo CD 가 관리하게 하는 Application.
# run-all.sh 는 이 파일을 kubectl apply 로 바로 넣는다 (RUN-ALL.md 결정 3). poc/01-argocd/gitops/apps/ 에 복사하면 root(App of Apps)가 대신 만든다.
# 주의: Argo CD 는 Git 을 읽으니, k8s/platform/ 을 바꿨다면 push 한 뒤에 sync 한다
# 문서: https://argo-cd.readthedocs.io/en/stable/user-guide/directory/
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-05
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Pionia5375/Softbank_Study_1
    targetRevision: main
    # 레포 루트 기준. control-plane/ 과 ops-agent/ 를 둘 다 담은 상위 폴더
    path: poc/05-control-plane-mcp/k8s/platform
    # 평범한 YAML 폴더(Helm 차트 아님). 하위 폴더까지 읽으려면?
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    # namespace 를 비워 둔다: 파일마다 metadata.namespace 가 다르다 (faas-system, faas-build, tenant-a)
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
