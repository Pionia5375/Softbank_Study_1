# 컨트롤 플레인 ServiceAccount 와 권한. Jeong 작성, 빈칸 8개.
#
# RBAC 4종 정리
#   Role               = 권한 목록. 한 namespace 안에서만 의미 있다
#   ClusterRole        = 권한 목록. namespace 가 없는 리소스(Namespace, Node)나 "여러 namespace 에서 재사용할 모양" 에 쓴다
#   RoleBinding        = "누구(subjects)에게 어떤 권한(roleRef)을 이 namespace 에서" 준다. roleRef 로 ClusterRole 도 가리킬 수 있다
#   ClusterRoleBinding = 클러스터 전체에서 준다. 꼭 필요할 때만
# verbs: get(하나 읽기) list(목록) watch(바뀌면 알림 받기) create patch update delete
# 원칙: FunctionDeployer.java 가 실제로 부르는 API 만 연다. 코드에서 k8s.xxx() 호출을 찾아보면 답이 나온다
# 문서: https://kubernetes.io/docs/reference/access-authn-authz/rbac/
apiVersion: v1
kind: ServiceAccount
metadata:
  name: control-plane
  namespace: faas-system
---
# (1) 빌드 namespace 안에서만: Job·ConfigMap 만들기, 빌드 파드 읽기(digest)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: control-plane-builder
  namespace: faas-build
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    # startDeploy: get(있나?) create / status: list(라벨로) / finishDeploy: waitUntilCondition 은 내부적으로 list + watch
    verbs: [___]
  - apiGroups: [""]
    resources: ["configmaps"]
    # 소스 ConfigMap 만들기만 한다. 지우는 건 Job 의 ownerReference 로 쓰레기 수집기가 한다 → delete 불필요
    verbs: [___]
  - apiGroups: [""]
    resources: ["pods"]
    # readDigest: 라벨로 빌드 파드 목록을 읽는다. 로그나 exec 권한은 필요 없다
    verbs: [___]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: control-plane-builder
  namespace: faas-build
subjects:
  - kind: ServiceAccount
    name: control-plane
    # ServiceAccount 가 사는 namespace (RoleBinding 이 있는 faas-build 가 아니다!)
    namespace: ___
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: control-plane-builder
---
# (2) 테넌트 확인용: Namespace 는 namespace 가 없는 리소스라 ClusterRole + ClusterRoleBinding 이 필요하다
apiVersion: rbac.authorization.k8s.io/v1
kind: ___
metadata:
  name: faas-control-plane-namespaces
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    # tenantExists 는 이름으로 하나만 읽는다. list 를 주면 모든 테넌트 이름이 보인다 → 주지 않는다
    verbs: [___]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ___
metadata:
  name: faas-control-plane-namespaces
subjects:
  - kind: ServiceAccount
    name: control-plane
    namespace: faas-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: faas-control-plane-namespaces
---
# (3) Knative Service 다루기: 권한 "모양" 만 ClusterRole 로 한 번 정의하고,
#     실제로 쓸 수 있는 곳은 테넌트 namespace 마다 RoleBinding 으로 하나씩 연다 (tenant-a.yaml)
#     → kube-system 에는 RoleBinding 이 없으니 코드에 버그가 있어도 거기엔 못 만든다
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: faas-control-plane-functions
rules:
  - apiGroups: [___]
    resources: ["services"]
    # status: get / finishDeploy: server-side apply 는 HTTP PATCH 다 (없으면 생성까지 PATCH 한 번으로)
    verbs: ["get", "list", "create", "patch"]
