# AWS Node Termination Handler(NTH). Jeong 작성, 정답본.
# 스팟 노드마다 하나씩 떠서(DaemonSet) EC2 메타데이터를 지켜보다가 "2분 뒤 회수" 경고가 오면
# 그 노드를 cordon(새 파드 금지) + drain(파드를 다른 노드로 내보냄) 한다.
# 이게 없으면: 2분 뒤 노드가 그냥 꺼지고, k8s 는 몇 분 동안 "노드가 응답이 없네" 만 기다린다.
# 문서: https://github.com/aws/aws-node-termination-handler (IMDS 모드)
#       values 목록: helm show values eks/aws-node-termination-handler
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: node-termination-handler
  namespace: argocd
  # root-ec2 를 지울 때 이 Application 이 만든 리소스도 같이 지워지게 (없으면 고아로 남는다)
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # 차트는 OCI 레지스트리로 옮겨졌다. 옛 eks-charts(https://aws.github.io/eks-charts)는 0.21.0(앱 v1.19.0)에서 멈춰 있다.
    # Argo CD v3.1+ 는 oci:// 주소를 바로 소스로 쓸 수 있다 (우리 차트 10.10.5 = v3.5).
    #   문서: https://argo-cd.readthedocs.io/en/stable/user-guide/oci/
    # 【추정】 oci 소스가 Helm 차트를 자동 인식하지 못하면 대안: argocd repo add public.ecr.aws/aws-ec2/helm --type helm --enable-oci
    #   한 뒤 repoURL: public.ecr.aws/aws-ec2/helm + chart: aws-node-termination-handler 로 쓴다.
    repoURL: oci://public.ecr.aws/aws-ec2/helm/aws-node-termination-handler
    # 버전 고정 (2026-10-20 기준 차트 0.27.6 = 앱 v1.25.6). 10/27 아침 helm show chart oci://public.ecr.aws/aws-ec2/helm/aws-node-termination-handler 로 다시 확인
    targetRevision: 0.27.6
    helm:
      valuesObject:
        enableSpotInterruptionDraining: true    # 회수 경고 → drain
        enableScheduledEventDraining: true      # AWS 정기 점검 예고 → drain
        enableRebalanceMonitoring: false        # "회수 위험 높아짐" 신호는 ASG(capacity_rebalance)가 처리
        # 스팟 노드에만 띄운다. 온디맨드(시스템·빌드)에는 회수 경고가 없으니 필요 없다
        # 【추정】 키 이름은 차트 values.yaml 에서 확인 (daemonsetNodeSelector)
        daemonsetNodeSelector:
          capacity-type: spot
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
