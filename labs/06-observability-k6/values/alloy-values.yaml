# Grafana Alloy: Pod 로그를 모아 Loki 로 보내는 수집기 (Promtail 후속. Promtail 은 2026-03-02 EOL).
#   helm install alloy grafana/alloy --version 1.13.0 -n monitoring -f values/alloy-values.yaml
# 키 이름 출처 【사실: https://github.com/grafana/alloy/blob/main/operations/helm/charts/alloy/values.yaml, 2026-10-06】
# 설정 문법 출처 【사실: https://github.com/grafana/alloy/blob/main/docs/sources/reference/components/loki/loki.source.kubernetes.md】

controller:
  # 기본은 daemonset (노드마다 1개). 여기선 1개짜리 deployment.
  # 이유: loki.source.kubernetes 는 노드 파일이 아니라 K8s API 로 로그를 읽어서, 1개가 클러스터 전체를 맡을 수 있다.
  #   daemonset 로 두면 3개가 같은 로그를 3번씩 보낸다 (clustering 을 따로 켜야 나눠 맡음)
  type: deployment
  replicas: 1

alloy:
  # 익명 사용 통계 전송 끔
  enableReporting: false
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { memory: 256Mi }
  configMap:
    create: true
    # 아래는 Alloy 설정 언어. "부품 이름 "라벨" { ... }" 블록을 이어 붙여 파이프라인을 만든다.
    #   찾기(discovery.kubernetes) → 이름표 붙이기(discovery.relabel) → 읽기(loki.source.kubernetes) → 보내기(loki.write)
    content: |
      // 1) 클러스터의 Pod 목록을 API 에서 받아 온다. 볼 네임스페이스만 고른다
      discovery.kubernetes "pods" {
        role = "pod"
        namespaces {
          names = ["default", "traefik"]
        }
      }

      // 2) Loki 에서 검색할 때 쓸 이름표(label)를 붙인다. __meta_* 는 discovery 가 준 원래 정보
      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        // hello 차트의 Pod 라벨 app=hello 를 그대로 app 으로
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app"]
          target_label  = "app"
        }
        // Traefik 차트 Pod 는 app.kubernetes.io/name=traefik
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app_name"
        }
      }

      // 3) 각 컨테이너 로그를 K8s API 로 따라 읽는다 (kubectl logs -f 와 같은 길)
      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pods.output
        forward_to = [loki.write.local.receiver]
      }

      // 4) Loki 로 보낸다. 주소 = loki 차트(gateway 끔)의 Service
      loki.write "local" {
        endpoint {
          url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
        }
      }
