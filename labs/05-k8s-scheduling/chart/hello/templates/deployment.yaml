# Lab 02 차트 + Lab 03(probe, resources) + Lab 04(preStop, HPA) + Lab 05(스케줄링). 추가된 부분은 "Lab 0N" 주석으로 표시.
# .Release.Name = helm install 할 때 붙인 이름 (같은 차트를 이름만 바꿔 여러 번 설치할 수 있다)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  # Lab 04: HPA 를 켜면 Pod 수는 HPA 가 정한다. 여기서 replicas 를 적으면 helm upgrade 때마다 HPA 값을 덮어써 버린다
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      {{- with .Values.priorityClassName }}
      # Lab 05: 자리가 모자랄 때 누가 먼저인지. 숫자가 큰 PriorityClass 가 작은 쪽 Pod 를 쫓아내고(선점) 들어간다
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      # Lab 05: 이 라벨이 붙은 노드에만 간다
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      # Lab 05: taint(출입 금지 표시)가 있는 노드라도 이 조건이 맞으면 들어갈 수 있다
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.spreadAcrossNodes }}
      # Lab 05: Pod 를 노드마다 고르게 나눠 놓으려고 노력한다 (안 되면 그냥 배치 = ScheduleAnyway)
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: {{ .Release.Name }}
      {{- end }}
      {{- if .Values.preStop.sleepSeconds }}
      # Lab 04: preStop 이 끝날 때까지 기다려 줄 최대 시간. 기본 30s 라 지금은 안 바꿔도 된다 (적어 두기만)
      terminationGracePeriodSeconds: 30
      {{- end }}
      containers:
        - name: hello
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
          {{- if .Values.probes.enabled }}
          # Lab 03: readinessProbe = "요청 받을 준비 됐나?" 실패하면 Service 명단에서 빠진다 (재시작은 안 함)
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.targetPort }}
            periodSeconds: {{ required "TODO(human): probes.readiness.periodSeconds" .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          # Lab 03: livenessProbe = "살아 있나?" 연속 실패하면 kubelet 이 컨테이너를 재시작한다
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: {{ required "TODO(human): probes.liveness.initialDelaySeconds" .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          {{- end }}
          {{- if .Values.preStop.sleepSeconds }}
          # Lab 04: 꺼지라는 신호(SIGTERM)를 보내기 전에 N초 기다린다.
          #   그 사이 Service 명단에서 빠진 사실이 Traefik 까지 퍼져서, 꺼지는 Pod 로 요청이 안 간다
          lifecycle:
            preStop:
              sleep:
                seconds: {{ .Values.preStop.sleepSeconds }}
          {{- end }}
          {{- with .Values.resources }}
          # Lab 03: requests = 스케줄러가 "이만큼은 보장" 하고 자리 잡는 값, limits = 넘으면 막히는 상한
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
