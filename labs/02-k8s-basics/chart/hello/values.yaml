# values.yaml = 차트의 설정 기본값.
# 템플릿(templates/*.yaml)은 {{ .Values.xxx }} 로 이 값을 읽는다.
# 환경마다 다른 값은 -f values-<환경>.yaml 로 덮어쓴다.

replicaCount: 1

image:
  repository: lab01-hello
  tag: multi
  pullPolicy: IfNotPresent

service:
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: traefik
  host: ""          # 비워 두면 어떤 도메인으로 와도 받는다

