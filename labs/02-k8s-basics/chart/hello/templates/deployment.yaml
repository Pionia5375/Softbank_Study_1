# k8s/deployment.yaml 과 같은 내용. 환경마다 바뀌는 부분만 이중 중괄호 템플릿으로 뚫어 뒀다.
# .Release.Name = helm install 할 때 붙인 이름 (같은 차트를 이름만 바꿔 여러 번 설치할 수 있다)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      containers:
        - name: hello
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
