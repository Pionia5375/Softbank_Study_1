# Ingress: 클러스터 바깥 HTTP 요청을 "경로/도메인 규칙"에 따라 Service 로 보내는 라우팅 표.
# 주의: 이 파일은 규칙표일 뿐이고, 실제로 요청을 받아 전달하는 프로그램은 Ingress 컨트롤러(여기선 Traefik)다.
#       컨트롤러가 설치돼 있지 않으면 이 파일을 apply 해도 아무 일도 안 일어난다.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hello
spec:
  ingressClassName: traefik    # 어떤 컨트롤러가 이 규칙을 처리할지
  rules:
    - http:                    # host 를 안 적으면 "어떤 도메인으로 와도"
        paths:
          - path: /
            pathType: Prefix   # / 로 시작하는 모든 경로
            backend:
              service:
                name: hello    # service.yaml 의 이름
                port:
                  number: 80
