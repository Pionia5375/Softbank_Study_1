# Ingress: 클러스터 바깥 HTTP 요청을 "경로/도메인 규칙"에 따라 Service 로 보내는 라우팅 표.
# Spring 비유: @RequestMapping 표. 단, 실제로 요청을 받는 건 Ingress 컨트롤러(여기선 Traefik)이고
#              이 파일은 컨트롤러가 읽는 규칙일 뿐이다.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hello
spec:
  ingressClassName: traefik    # 어떤 컨트롤러가 이 규칙을 처리할지
  rules:
    - http:                    # host 를 안 적으면 "어떤 도메인으로 와도"
        paths:
          - path: /
            pathType: Prefix   # / 로 시작하는 모든 경로
            backend:
              service:
                name: hello    # service.yaml 의 이름
                port:
                  number: 80
