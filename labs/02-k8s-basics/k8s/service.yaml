# Service: Pod 여러 개 앞에 붙는 고정 이름 + 로드밸런서.
# Pod 는 죽고 다시 뜰 때마다 IP 가 바뀌니까, 다른 앱은 Pod IP 대신 이 Service 이름(hello)으로 부른다.
apiVersion: v1
kind: Service
metadata:
  name: hello
spec:
  type: ClusterIP          # 클러스터 안에서만 보이는 주소 (밖에서 들어오는 건 Ingress 담당)
  selector:
    app: hello             # 이 라벨을 가진 Pod 들에게 요청을 나눠 준다
  ports:
    - port: 80             # Service 가 받는 포트
      targetPort: 8080     # Pod(컨테이너) 안의 Spring 포트
