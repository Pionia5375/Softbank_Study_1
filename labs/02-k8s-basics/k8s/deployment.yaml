# Deployment: "이 이미지로 Pod 를 N개 항상 띄워 둬" 라는 선언.
# 내가 컨테이너를 직접 docker run 하지 않는다. 원하는 상태만 적어 두면 K8s 가 만들고, 죽으면 다시 띄운다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
  labels:
    app: hello
spec:
  # TODO(human): Pod 를 몇 개 띄울지 정한다. (2단계에서 Pod/ReplicaSet 개념을 배운 뒤)
  #   - 1로 apply → /hello 를 여러 번 호출해서 host 값 확인
  #   - 숫자를 바꿔 다시 apply → host 값이 어떻게 달라지는지 확인
  #   - 고른 숫자와 이유(가용성 vs 맥 메모리 7.7GB)를 README 측정표 아래에 한 줄로 남긴다
  replicas: 1
  selector:
    matchLabels:
      app: hello          # 이 라벨이 붙은 Pod 를 "내 것"으로 관리한다
  template:               # 여기부터가 Pod 설계도
    metadata:
      labels:
        app: hello        # 위 selector 와 반드시 같아야 한다
    spec:
      containers:
        - name: hello
          image: lab01-hello:multi     # Lab 01 에서 만든 이미지 (kind load 로 클러스터에 넣어 둔다)
          imagePullPolicy: IfNotPresent  # 노드에 이미 있으면 인터넷에서 받으려 하지 않는다
          ports:
            - containerPort: 8080
